<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="BusRoute — Your booking is confirmed. View your booking summary and reference number." />
  <title>Booking Confirmation — BusRoute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css?v=5" />
  <!-- Check login status -->
  <script>
    if (!localStorage.getItem("busroute_current")) {
      window.location.replace("/login.html");
    }
  </script>
</head>
<body data-page="confirmation">

  <!-- NAVIGATION -->
  <header>
    <nav class="nav" aria-label="Main navigation">
      <div class="nav-inner">
        <a href="/" class="nav-logo" aria-label="BusRoute — Home">
          <div class="nav-logo-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <rect x="1" y="3" width="22" height="13" rx="2"/>
              <path d="M5 16v3M19 16v3M1 10h22"/>
              <circle cx="7" cy="19" r="1" fill="currentColor"/>
              <circle cx="17" cy="19" r="1" fill="currentColor"/>
            </svg>
          </div>
          BusRoute
        </a>
        <ul class="nav-links" role="list">
          <li><a href="/">Home</a></li>
          <li><a href="/buses/">Search Buses</a></li>
          <li id="auth-nav-placeholder"></li>
        </ul>
        <button id="hamburger-btn" class="hamburger" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
    </nav>
    <div id="mobile-overlay" class="mobile-overlay" aria-hidden="true"></div>
    <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation">
      <a href="/">Home</a>
      <a href="/buses/">Search Buses</a>
      <div id="mobile-auth-nav"></div>
    </nav>
  </header>

  <main id="main-content">

    <section class="confirmation-page" aria-labelledby="confirmation-heading">
      <div class="container">

        <!-- Confirmation card — populated by initConfirmationPage() in app.js?v=5 -->
        <div id="confirmation-card" class="confirmation-card" aria-live="polite">
          <!-- Rendered by renderConfirmation() in app.js?v=5 -->
        </div>

        <!-- Guest account prompt (shown when not logged in) or saved-note (when logged in) -->
        <!-- Rendered by initConfirmationPage() in app.js?v=5 -->
        <div id="confirmation-auth-prompt"></div>

      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer" aria-label="Site footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <a href="/" class="nav-logo">
            <div class="nav-logo-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <rect x="1" y="3" width="22" height="13" rx="2"/>
                <path d="M5 16v3M19 16v3M1 10h22"/>
              </svg>
            </div>
            BusRoute
          </a>
          <p>Online Bus Ticket Reservation Platform</p>
        </div>
        <div>
          <div class="footer-col-title">Navigation</div>
          <ul class="footer-links" role="list">
            <li><a href="/">Home</a></li>
            <li><a href="/buses/">Search Buses</a></li>
            </ul>
        </div>
        <div></div>
        <div></div>
      </div>
      <div class="footer-bottom">
        <span>© 2026 BusRoute Inc.</span>
        <span>Safe and convenient travel.</span>
      </div>
    </div>
  </footer>

  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js?v=5"></script>
</body>
</html>
